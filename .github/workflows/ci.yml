          if ! [[ "${BASE_SHA:-}" =~ $sha_re && "${HEAD_SHA:-}" =~ $sha_re ]]; then
            decide true "base or head SHA is missing or malformed"
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            decide true "base or head commit is not available locally"
          fi
          changed=$(mktemp)
          trap 'rm -f "$changed"' EXIT
          if ! git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" >"$changed"; then
            decide true "git diff failed"
          fi
          while IFS= read -r -d '' path; do
            case "$path" in
              src/* | scripts/* | tests/* | .github/workflows/ci.yml | .github/workflows/actions.lock | PSScriptAnalyzerSettings.psd1)
                decide true "a salient path changed"
                ;;
            esac
          done <"$changed"
          decide false "no salient path changed"
      - name: Install powershell-yaml
        if: steps.salient.outputs.run == 'true'
        shell: pwsh
        run: Install-Module -Name powershell-yaml -RequiredVersion 0.4.12 -Repository PSGallery -Scope CurrentUser -Force -ErrorAction Stop
      - name: Pester (agent workspace trust, Linux)
        if: steps.salient.outputs.run == 'true'
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          (Get-Module -ListAvailable Pester | Sort-Object Version -Descending | Select-Object -First 1).Version
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests/AgentWorkspaceTrust.Tests.ps1'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
      - name: Nothing salient changed
        if: steps.salient.outputs.run != 'true'
        shell: bash
        run: echo "No salient path changed in this pull request; skipping."
